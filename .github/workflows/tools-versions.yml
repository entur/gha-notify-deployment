name: "Extract Tool Versions"

on:
  workflow_call:
    outputs:
      python:
        description: "Python version from .tool-versions"
        value: ${{ jobs.versions.outputs.python }}
      poetry:
        description: "Poetry version from .tool-versions"
        value: ${{ jobs.versions.outputs.poetry }}

jobs:
  versions:
    name: extract tools versions
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.parse_tool_versions.outputs.python }}
      poetry: ${{ steps.parse_tool_versions.outputs.poetry }}
      terraform: ${{ steps.parse_tool_versions.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Parse .tool-versions
        id: parse_tool_versions
        uses: paulo-ferraz-oliveira/parse-tool-versions@534819f70c0c04d788b49dafc29c8117901277bd # v1.0.3
